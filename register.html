<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Food Ordering Platform</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">🍽️ FoodOrder</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="order-tracking.html">Track Order</a></li>
                <li>
                    <a href="cart.html" class="cart-icon">
                        🛒
                        <span class="cart-badge" style="display: none;">0</span>
                    </a>
                </li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="container-lg">
            <div class="card">
                <div class="card-header text-center">Create Account</div>
                <form id="register-form" onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label for="fullName">Full Name *</label>
                        <input type="text" id="fullName" name="fullName" class="form-control" required>
                        <div class="error-message"></div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <input type="email" id="email" name="email" class="form-control" required>
                        <div class="error-message"></div>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number *</label>
                        <input type="tel" id="phone" name="phone" class="form-control" required>
                        <div class="error-message"></div>
                    </div>

                    <div class="form-group">
                        <label for="address">Address</label>
                        <textarea id="address" name="address" class="form-control" rows="3"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="password">Password *</label>
                        <input type="password" id="password" name="password" class="form-control" required>
                        <div class="error-message"></div>
                        <small class="small-text">Must be at least 6 characters</small>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password *</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" required>
                        <div class="error-message"></div>
                    </div>

                    <div class="form-group">
                        <label class="flex-checkbox">
                            <input type="checkbox" id="terms" required>
                            <span>I agree to the <a href="#" class="link-primary">Terms and Conditions</a></span>
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Register</button>
                </form>

                <div class="text-center mt-3">
                    <p>Already have an account? <a href="login.html" class="link-primary">Login here</a></p>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 FoodOrder Platform. All rights reserved.</p>
    </footer>

    <!-- Load helpers and validation, then this page's script -->
    <script src="js/main.js"></script>
    <script src="js/helpers.js"></script>
    <script src="js/validation.js"></script>
    
    <script>
        /**
         * Handle register form submission
         * Simple: get form values, call register() helper function
         */
        function handleRegister(event) {
            event.preventDefault();

            // Run validation for the register form
            const rules = {
                fullName: { required: true, minLength: 2 },
                email: { required: true, email: true },
                phone: { required: true, phone: true },
                password: { required: true, password: true },
                confirmPassword: { required: true }
            };
            if (!validateForm('register-form', rules)) {
                showMessage('Please fix the errors in the form');
                return;
            }

            // Get form values
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const address = document.getElementById('address').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validate passwords match
            if (password !== confirmPassword) {
                showMessage('Passwords do not match');
                return;
            }

            // Try to register using helper function
            if (register(fullName, email, phone, address, password)) {
                // Registration successful - redirect to home
                showMessage('Registration successful! Welcome ' + fullName);
                goToPage('/index.html');
            } else {
                // Registration failed (email already exists)
                showMessage('Email already registered. Please use a different email or login.');
            }
        }
    </script>
</body>html>
