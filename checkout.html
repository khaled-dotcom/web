<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Food Ordering Platform</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">🍽️ FoodOrder</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="order-tracking.html">Track Order</a></li>
                <li>
                    <a href="cart.html" class="cart-icon">
                        🛒
                        <span class="cart-badge" style="display: none;">0</span>
                    </a>
                </li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1 class="mb-3">Checkout</h1>

        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 2rem;">
            <div class="card">
                <div class="card-header">Delivery Information</div>
                <form id="checkout-form" onsubmit="handleCheckout(event)">
                    <div class="form-group">
                        <label for="fullName">Full Name *</label>
                        <input type="text" id="fullName" name="fullName" class="form-control" required>
                        <div class="error-message"></div>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number *</label>
                        <input type="tel" id="phone" name="phone" class="form-control" required>
                        <div class="error-message"></div>
                    </div>

                    <div class="form-group">
                        <label for="address">Delivery Address *</label>
                        <textarea id="address" name="address" class="form-control" rows="3" required></textarea>
                        <div class="error-message"></div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label for="city">City *</label>
                            <input type="text" id="city" name="city" class="form-control" required>
                            <div class="error-message"></div>
                        </div>

                        <div class="form-group">
                            <label for="zipCode">Zip Code *</label>
                            <input type="text" id="zipCode" name="zipCode" class="form-control" required>
                            <div class="error-message"></div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="specialInstructions">Special Instructions (Optional)</label>
                        <textarea id="specialInstructions" name="specialInstructions" class="form-control" rows="3"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="paymentMethod">Payment Method *</label>
                        <select id="paymentMethod" name="paymentMethod" class="form-control" required>
                            <option value="">Select payment method</option>
                            <option value="cash">Cash on Delivery</option>
                            <option value="card">Credit/Debit Card</option>
                            <option value="online">Online Payment</option>
                        </select>
                        <div class="error-message"></div>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;">Place Order</button>
                </form>
            </div>

            <div class="card">
                <div class="card-header">Order Summary</div>
                <div id="checkout-summary">
                    <!-- Order summary will be populated by JavaScript -->
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 FoodOrder Platform. All rights reserved.</p>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/validation.js"></script>
    <script>
        // Display checkout summary
        function displayCheckoutSummary() {
            const summary = document.getElementById('checkout-summary');
            if (!summary) return;

            // Get cart from in-memory data
            const cart = getCart();
            
            if (cart.length === 0) {
                summary.innerHTML = `
                    <div class="empty-state">
                        <p>Your cart is empty</p>
                        <a href="menu.html" class="btn btn-primary mt-2">Browse Menu</a>
                    </div>
                `;
                return;
            }

            const totals = calculateTotal();
            
            // Helper function to escape HTML
            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
            
            summary.innerHTML = `
                <div style="margin-bottom: 1rem;">
                    ${cart.map(item => {
                        const itemName = escapeHtml(item.name || 'Unknown Item');
                        const itemPrice = parseFloat(item.price) || 0;
                        const itemQuantity = parseInt(item.quantity) || 1;
                        return `
                        <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                            <span>${itemName} x${itemQuantity}</span>
                            <span>$${(itemPrice * itemQuantity).toFixed(2)}</span>
                        </div>
                        `;
                    }).join('')}
                </div>
                <div style="border-top: 2px solid var(--border-color); padding-top: 1rem; margin-top: 1rem;">
                    <div class="summary-row">
                        <span>Subtotal:</span>
                        <span>$${totals.subtotal.toFixed(2)}</span>
                    </div>
                    <div class="summary-row">
                        <span>Tax (8%):</span>
                        <span>$${totals.tax.toFixed(2)}</span>
                    </div>
                    <div class="summary-row">
                        <span>Delivery Fee:</span>
                        <span>${totals.deliveryFee === 0 ? 'FREE' : '$' + totals.deliveryFee.toFixed(2)}</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total:</span>
                        <span>$${totals.total.toFixed(2)}</span>
                    </div>
                </div>
            `;
        }

        // Handle checkout form submission
        function handleCheckout(event) {
            event.preventDefault();
            
            const cart = getCart();
            if (cart.length === 0) {
                alert('Your cart is empty!');
                return;
            }

            // Validate form
            const rules = {
                fullName: { required: true, minLength: 2 },
                phone: { required: true, phone: true },
                address: { required: true, minLength: 10 },
                city: { required: true },
                zipCode: { required: true },
                paymentMethod: { required: true }
            };

            if (!validateForm('checkout-form', rules)) {
                alert('Please fix the errors in the form');
                return;
            }

            // Generate order ID
            const orderId = Math.floor(1000 + Math.random() * 9000);
            const orderData = {
                id: orderId,
                date: new Date().toISOString(),
                items: cart,
                total: calculateTotal().total,
                status: 'pending',
                deliveryInfo: {
                    fullName: document.getElementById('fullName').value,
                    phone: document.getElementById('phone').value,
                    address: document.getElementById('address').value,
                    city: document.getElementById('city').value,
                    zipCode: document.getElementById('zipCode').value,
                    specialInstructions: document.getElementById('specialInstructions').value
                },
                paymentMethod: document.getElementById('paymentMethod').value
            };

            // Save order to in-memory allOrders array
            allOrders.push(orderData);

            // Clear cart using helper function
            clearCart();

            // Redirect to order tracking
            window.location.href = `order-tracking.html?id=${orderId}`;
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            displayCheckoutSummary();
            addErrorMessages('checkout-form');
            setupValidation('checkout-form', {
                fullName: { required: true, minLength: 2 },
                phone: { required: true, phone: true },
                address: { required: true, minLength: 10 },
                city: { required: true },
                zipCode: { required: true },
                paymentMethod: { required: true }
            });
        });
    </script>
    <style>
        @media (max-width: 768px) {
            main > div {
                grid-template-columns: 1fr !important;
            }
        }
    </style>
</body>
</html>
