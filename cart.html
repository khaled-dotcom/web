<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Shopping Cart - Food Ordering Platform</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">🍽️ FoodOrder</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="order-tracking.html">Track Order</a></li>
                <li>
                    <a href="cart.html" class="cart-icon">
                        🛒
                        <span class="cart-badge" style="display: none;">0</span>
                    </a>
                </li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1 class="mb-3">Shopping Cart</h1>
        
        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 2rem;">
            <div class="card">
                <div class="card-header">Cart Items</div>
                <div id="cart-items">
                    <!-- Cart items will be populated by JavaScript -->
                </div>
            </div>

            <div class="card">
                <div class="card-header">Order Summary</div>
                <div id="cart-summary">
                    <!-- Cart summary will be populated by JavaScript -->
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 FoodOrder Platform. All rights reserved.</p>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/cart.js"></script>
    <style>
        @media (max-width: 768px) {
            main > div {
                grid-template-columns: 1fr !important;
            }
        }
    </style>
</body>
</html>
