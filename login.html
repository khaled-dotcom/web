<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Food Ordering Platform</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">🍽️ FoodOrder</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="order-tracking.html">Track Order</a></li>
                <li>
                    <a href="cart.html" class="cart-icon">
                        🛒
                        <span class="cart-badge" style="display: none;">0</span>
                    </a>
                </li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="container-centered">
            <div class="card">
                <div class="card-header text-center">Login</div>
                <form id="login-form" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <input type="email" id="email" name="email" class="form-control" required>
                        <div class="error-message" id="emailError"></div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password *</label>
                        <input type="password" id="password" name="password" class="form-control" required>
                        <div class="error-message" id="passwordError"></div>
                    </div>

                    <div class="form-group">
                        <label class="flex-checkbox">
                            <input type="checkbox" id="remember">
                            <span>Remember me</span>
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>

                <div class="text-center mt-3">
                    <p>Don't have an account? <a href="register.html" class="link-primary">Register here</a></p>
                    <p class="small-text">
                        Demo: admin@foodorder.com / admin123
                    </p>
                </div>


                <div class="divider-section">
                    <p class="text-center">Admin Login</p>
                    <a href="admin/dashboard.html" class="btn btn-outline w-100">Admin Dashboard</a>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 FoodOrder Platform. All rights reserved.</p>
    </footer>

    <!-- Load helpers and validation, then this page's script -->
    <script src="js/main.js"></script>
    <script src="js/helpers.js"></script>
    <script src="js/validation.js"></script>
    
    <script>
        /**
         * Handle login form submission
         * Simple: get email and password, call login() helper function
         */
        function handleLogin(event) {
            event.preventDefault();
            // Validate form using validation.js rules
            const rules = {
                email: { required: true, email: true },
                password: { required: true }
            };
            if (!validateForm('login-form', rules)) {
                showMessage('Please fix the errors in the form');
                return;
            }

            // Get form values
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Try to login using helper function
            if (login(email, password)) {
                // Login successful - redirect based on user role
                const user = getCurrentUser();
                if (user && user.role === 'admin') {
                    goToPage('/admin/dashboard.html');
                } else {
                    goToPage('/index.html');
                }
            } else {
                // Login failed - show error
                showMessage('Invalid email or password.\n\nDemo: admin@foodorder.com / admin123');
            }
        }
    </script>
</body>
</html>
